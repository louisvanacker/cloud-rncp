# Prometheus local (docker compose --profile obs). Sur AKS c'est kube-prometheus-stack + ServiceMonitors.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:3000"]
        labels: { namespace: local }
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
        labels: { namespace: local }
