# Pipeline CI/CD : sur push -> lint, tests, scans de sécurité, build & push des images, déploiement.
#   - Pull request        : CI uniquement (rien n'est poussé ni déployé)
#   - Push sur main       : CI + images + déploiement automatique en DEV
#   - Tag vX.Y.Z          : CI + images + déploiement en PROD après approbation manuelle
# Authentification Azure par OIDC (aucun secret Azure stocké dans GitHub).
name: ci-cd

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  KUSTOMIZE_VERSION: "5.6.0"
  KUBECONFORM_VERSION: "0.7.0"
  TRIVY_IMAGE: aquasec/trivy:0.70.0 # version figée (idéalement : figer aussi par digest)

jobs:
  # ---------------------------------------------------------------- CI applicative
  test:
    name: lint & tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, worker, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - if: matrix.app == 'frontend'
        run: npm run build
      # Dépendances de production vulnérables (ISO 27001 A.8.28)
      - run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------- Sécurité du code et de l'IaC
  security:
    name: scans de sécurité (secrets, IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Détection de secrets commités (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 detect --source /repo --redact --verbose
      - name: Mauvaises configurations Kubernetes / Terraform / Dockerfile (trivy config)
        run: >
          docker run --rm -v "$PWD:/repo" ${{ env.TRIVY_IMAGE }} config /repo
          --severity HIGH,CRITICAL --exit-code 1 --skip-dirs /repo/node_modules
          --ignorefile /repo/.trivyignore

  iac:
    name: validation IaC (kustomize, terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: Rendu + validation des manifests (schémas K8s et CRD)
        run: |
          printf 'DB_PASSWORD=x\nREDIS_PASSWORD=x\nJWT_SECRET=x\nS3_ACCESS_KEY=x\nS3_SECRET_KEY=x\n' > k8s/overlays/standalone/secrets.env
          printf 'DB_PASSWORD=x\nREDIS_PASSWORD=x\n' > k8s/overlays/standalone/data-secrets.env
          for o in standalone dev prod; do
            echo "::group::overlay $o"
            kustomize build "k8s/overlays/$o" | kubeconform -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt / validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # ---------------------------------------------------------------- Images
  images:
    name: build, scan & push (${{ matrix.app }})
    if: github.event_name == 'push'
    needs: [test, security, iac]
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'dev' }}
    permissions:
      contents: read
      id-token: write # jeton OIDC pour Azure
    strategy:
      matrix:
        app: [backend, worker, frontend]
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/biblio-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Build (image chargée localement pour être scannée AVANT le push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: false
      - name: Scan de vulnérabilités de l'image (bloquant si CRITICAL corrigeable)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ${{ env.TRIVY_IMAGE }}
          image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"
      - name: Taille de l'image (suivi FinOps)
        run: docker image inspect "$IMAGE:${{ github.sha }}" --format '{{.Size}}' | numfmt --to=iec | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tags et push
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${GITHUB_REF_NAME}"
            docker push "$IMAGE:${GITHUB_REF_NAME}"
          fi

  # ---------------------------------------------------------------- Déploiements
  deploy-dev:
    name: déploiement DEV
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          overlay: dev
          namespace: biblio-dev
          tag: ${{ github.sha }}
          acr-login-server: ${{ vars.ACR_LOGIN_SERVER }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          aks-name: ${{ vars.AKS_NAME }}

  deploy-prod:
    name: déploiement PROD
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    environment: production # règle de protection GitHub : approbation manuelle requise
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          overlay: prod
          namespace: biblio-prod
          tag: ${{ github.sha }}
          acr-login-server: ${{ vars.ACR_LOGIN_SERVER }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          aks-name: ${{ vars.AKS_NAME }}
