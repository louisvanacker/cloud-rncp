- op: add
  path: /spec/template/spec/initContainers/0/env/-
  value:
    name: S3_ACCESS_KEY
    valueFrom: { secretKeyRef: { name: biblio-secrets, key: S3_ACCESS_KEY } }
- op: add
  path: /spec/template/spec/initContainers/0/env/-
  value:
    name: S3_SECRET_KEY
    valueFrom: { secretKeyRef: { name: biblio-secrets, key: S3_SECRET_KEY } }
