apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
spec:
  isCA: true
  commonName: biblio-internal-ca
  secretName: internal-ca
  duration: 8760h # 1 an
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: Issuer }
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-tls
spec:
  secretName: postgres-tls
  duration: 2160h # 90 jours, renouvelé automatiquement 30 jours avant
  renewBefore: 720h
  dnsNames: [postgres, postgres-0.postgres]
  privateKey: { algorithm: ECDSA, size: 256 }
  usages: [server auth, digital signature, key encipherment]
  issuerRef: { name: internal-ca, kind: Issuer }
