apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Intégration Azure (AKS) :
#  - secrets lus dans Azure Key Vault via le Secrets Store CSI Driver, synchronisés en Secrets K8s
#  - Workload Identity : les pods obtiennent un jeton Entra ID sans aucune clé stockée
#  - stockage objet = Azure Blob Storage (chiffré au repos, accès par rôle IAM)
# Les identifiants (tenant, client IDs, nom du Key Vault...) arrivent par "replacements"
# depuis azure-settings.env, généré par Terraform dans chaque overlay.
resources:
  - secretproviderclass.yaml
  - issuer-letsencrypt.yaml
patches:
  - path: patch-serviceaccounts.yaml
  - path: patch-configmap.yaml
  - target: { kind: Deployment, name: "backend|worker" }
    path: patch-app-csi.yaml
  - target: { kind: Deployment, name: redis }
    path: patch-data-csi.yaml
  - target: { kind: StatefulSet, name: postgres }
    path: patch-data-csi.yaml
  - target: { kind: CronJob, name: postgres-backup }
    path: patch-backup-csi.yaml
# Les valeurs viennent du ConfigMap local "azure-settings" défini dans chaque overlay
replacements:
  - path: replacements.yaml
