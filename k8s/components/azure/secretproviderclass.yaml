# Deux SecretProviderClass = deux identités (moindre privilège, ISO 27001 A.5.17 / A.8.2) :
#  - app  : backend, worker, sauvegarde -> secrets applicatifs + accès Blob
#  - data : postgres, redis             -> uniquement leurs mots de passe, aucun accès Blob
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: biblio-kv-app
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: APP_CLIENT_ID # remplacé (replacements)
    keyvaultName: KEYVAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: seed-admin-email
          objectType: secret
        - |
          objectName: seed-admin-password
          objectType: secret
  secretObjects:
    - secretName: biblio-secrets
      type: Opaque
      data:
        - { objectName: db-password, key: DB_PASSWORD }
        - { objectName: redis-password, key: REDIS_PASSWORD }
        - { objectName: jwt-secret, key: JWT_SECRET }
        - { objectName: seed-admin-email, key: SEED_ADMIN_EMAIL }
        - { objectName: seed-admin-password, key: SEED_ADMIN_PASSWORD }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: biblio-kv-data
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: DATA_CLIENT_ID
    keyvaultName: KEYVAULT_NAME
    tenantId: TENANT_ID
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret
  secretObjects:
    - secretName: biblio-data-secrets
      type: Opaque
      data:
        - { objectName: db-password, key: DB_PASSWORD }
        - { objectName: redis-password, key: REDIS_PASSWORD }
