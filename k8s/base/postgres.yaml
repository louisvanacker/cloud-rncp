# PostgreSQL en StatefulSet avec stockage persistant (PersistentVolumeClaim).
# Sur AKS : disque managé Azure (StorageClass par défaut "managed-csi"), chiffré au repos par Azure.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      serviceAccountName: data
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # utilisateur postgres de l'image alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: biblio }
            - { name: POSTGRES_USER, value: biblio }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: biblio-data-secrets, key: DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # écrit uniquement dans ses volumes (données, socket, /tmp)
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [sh, -c, "pg_isready -U biblio -d biblio"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [sh, -c, "pg_isready -U biblio -d biblio"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
