# Un ServiceAccount par composant (moindre privilège, ISO 27001 A.8.2).
# Aucun n'a besoin de l'API Kubernetes : le jeton n'est pas monté.
# Sur AKS, backend/worker/postgres/redis sont fédérés à une identité Azure (composant azure).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data
automountServiceAccountToken: false
