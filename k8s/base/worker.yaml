# Worker asynchrone : consomme la file Redis (e-mails, exports PDF, nettoyage planifié).
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels: { app: worker }
spec:
  selector: { app: worker }
  ports:
    - { name: metrics, port: 9100, targetPort: metrics }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: worker }
spec:
  # Pas de 'replicas' : c'est l'HPA qui pilote le nombre de pods (sinon chaque apply le réinitialise)
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      serviceAccountName: worker
      terminationGracePeriodSeconds: 60 # laisse le temps de finir un export en cours
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: biblio-worker
          ports:
            - { name: metrics, containerPort: 9100 }
          envFrom:
            - configMapRef: { name: biblio-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: biblio-secrets, key: DB_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: biblio-secrets, key: REDIS_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
