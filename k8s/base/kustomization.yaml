apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Socle commun à tous les environnements. Le namespace, les images, l'hôte de l'Ingress,
# les secrets et le stockage sont fournis par les overlays (standalone / dev / prod).
labels:
  - pairs:
      app.kubernetes.io/part-of: biblio
    includeSelectors: false
resources:
  - serviceaccounts.yaml
  - rbac.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - mailpit.yaml
  - backend.yaml
  - worker.yaml
  - frontend.yaml
  - ingress.yaml
  - backup-cronjob.yaml
  - networkpolicies.yaml
images:
  - name: biblio-backend
    newTag: latest
  - name: biblio-worker
    newTag: latest
  - name: biblio-frontend
    newTag: latest
