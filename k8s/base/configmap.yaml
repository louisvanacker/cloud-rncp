# Configuration NON sensible (12-factor). Les secrets sont dans biblio-secrets / biblio-data-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: biblio-config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: biblio
  DB_USER: biblio
  DB_SSL: disable
  REDIS_URL: redis://redis:6379
  STORAGE_DRIVER: s3
  STORAGE_ATTACHMENTS_BUCKET: attachments
  STORAGE_BACKUPS_BUCKET: backups
  S3_ENDPOINT: http://minio:9000
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  CORS_ORIGINS: https://biblio.example.com
  APP_URL: https://biblio.example.com
  # Règles métier de la bibliothèque (modifiables sans reconstruire les images)
  LOAN_DAYS: "21"
  MAX_ACTIVE_LOANS: "5"
  RESERVATION_HOLD_DAYS: "3"
  REMINDER_DAYS_BEFORE: "2"
  OVERDUE_REPEAT_DAYS: "7"
  DAILY_JOB_CRON: "0 8 * * *"
  COVER_MAX_BYTES: "2097152"
  CSV_MAX_BYTES: "1048576"
  EXPORT_RETENTION_DAYS: "7"
  IMPORT_RETENTION_DAYS: "30"
  WORKER_CONCURRENCY: "5"
